[project]
name = "tminus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adarsh Kumar Reddy Nandina", email = "adarshreddyn99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tminus = "tminus:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, S: security issues
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests
