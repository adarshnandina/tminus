name: tminus

services:
  warehouse:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LOADER_PASSWORD: ${LOADER_PASSWORD}
      TRANSFORMER_PASSWORD: ${TRANSFORMER_PASSWORD}
      REPORTER_PASSWORD: ${REPORTER_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data                       # fixed path
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro          # setup scripts, read-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  warehouse_data: