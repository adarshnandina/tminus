name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege for the CI token too

concurrency:                # a new push cancels the outdated run for the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dev dependencies, Apply factory migrations twice (proves they are idempotent) # fails if uv.lock is out of date with pyproject.toml
        run: |
          uv sync --locked
          uv run --env-file .env python -m tminus.simulator.migrate
          uv run --env-file .env python -m tminus.simulator.migrate
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run all hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  warehouse-smoke-test:
    name: Warehouse smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from template
        run: cp .env.example .env
      - name: Start warehouse
        run: docker compose up -d --wait warehouse
      - name: Roles exist
        run: |
          roles=$(docker compose exec -T warehouse psql -U tminus_admin -d warehouse -tAc \
            "select string_agg(rolname, ',' order by rolname) from pg_roles
             where rolname in ('loader','transformer','reporter')")
          echo "Found roles: $roles"
          test "$roles" = "loader,reporter,transformer"
      - name: Reporter cannot create schemas
        run: |
          if docker compose exec -T warehouse psql -U reporter -d warehouse -c "create schema hack;"; then
            echo "::error::reporter was able to create a schema"; exit 1
          fi
      - name: Metabase app database exists
        run: |
          docker compose exec -T warehouse psql -U tminus_admin -d warehouse -tAc \
            "select 1 from pg_database where datname = 'metabase'" | grep -q 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs warehouse
      - name: Clean up
        if: always()
        run: docker compose down -v
